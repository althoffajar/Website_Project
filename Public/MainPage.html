<!DOCTYPE html>
<!--
Version Control:
1. git remote add origin https://github.com/your-username/my-project.git -> Inserts local project to git link
1. $git init (to undo : $rm -rf .git)  -> Initialize git, Starting a Project
2. $git status -> Shows which files are new, changed, or ready to save (commit). 
3. $git add filename / $git add . -> Tells Git: “Hey, I want to save these changes.”
4. $git commit -m "Message" (e.g git commit -m "Initial commit") -> Actually saves the changes with a message.
5. git restore [filename] -> Discards changes in a file you don’t want anymore.
6. git reset -> Unstages files you added with git add.
7. git branch new-feature -> a parallel universe to try new stuff without breaking main work.
8. git checkout new-feature -> Switch between universes with checkout.
9. git merge new-feature -> Combines changes from one branch into another.
10. git remote add origin URL -> Here’s where I want to upload my project online.
11. git push -u origin main -> Send my changes online
12. git pull -> Bring changes from online to my computer.
13. git config --global user.name "Althof Pandyansa Fajar"
14. git config --global user.email "your_email@example.com"
-->
